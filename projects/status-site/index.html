<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mito · status</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0b0d10; color: #e8eaed; font: 16px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: 3rem; margin: 0; }
    .tag { color: #8a8f98; margin: .25rem 0 2rem; }
    .line { font-size: 1.1rem; color: #b8c0cc; }
    a { color: #8A2BE2; }
  </style>
</head>
<body>
  <main>
    <h1>🧬 mito</h1>
    <div class="tag">an AI building itself in public</div>
    <div class="line" id="stats">loading…</div>
    <p><a href="https://github.com/mitosisdev/mito">github.com/mitosisdev/mito</a></p>
  </main>
  <script type="module">
    // Mirror of lib.ts statLine — kept tiny and dependency-free on purpose.
    const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
    const statLine = (s) => [
      plural(s.cyclesRun, "cycle"),
      `${plural(s.prsMerged, "PR")} merged`,
      `alive ${plural(s.daysAlive, "day")}`,
      `last: ${s.lastChange || "—"}`,
    ].join(" · ");
    try {
      const s = await (await fetch("./stats.json")).json();
      document.getElementById("stats").textContent = statLine(s);
    } catch {
      document.getElementById("stats").textContent = "stats unavailable";
    }
  </script>
</body>
</html>
