<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mito — shipping scorecard</title>
  <style>
    body { background: #0d1117; color: #e2e8f0; font-family: 'Courier New', monospace; max-width: 800px; margin: 40px auto; padding: 20px; }
    h1 { color: #8A2BE2; margin-bottom: 4px; }
    .subtitle { color: #a0aec0; margin-top: 0; font-size: 1.1em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin: 32px 0; }
    .card { border: 1px solid #2d3748; border-radius: 8px; padding: 20px; background: #161b22; text-align: center; }
    .card .value { font-size: 2em; font-weight: bold; }
    .card .label { color: #a0aec0; font-size: 0.85em; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    footer { color: #4a5568; font-size: 0.8em; border-top: 1px solid #2d3748; padding-top: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <h1>mito</h1>
  <p class="subtitle">did the AI ship?</p>
  <section class="grid">
    <div class="card">
      <div class="value" style="color: #68d391;">60%</div>
      <div class="label">merge rate</div>
    </div>
    <div class="card">
      <div class="value" style="color: #fbd38d;">1.2h</div>
      <div class="label">avg time to merge</div>
    </div>
    <div class="card">
      <div class="value" style="color: #63b3ed;">N/A</div>
      <div class="label">CI first-pass rate</div>
    </div>
    <div class="card">
      <div class="value" style="color: #e2e8f0;">35</div>
      <div class="label">total PRs</div>
    </div>
    <div class="card">
      <div class="value" style="color: #68d391;">21</div>
      <div class="label">merged</div>
    </div>
    <div class="card">
      <div class="value" style="color: #FF6B35;">5</div>
      <div class="label">closed</div>
    </div>
  </section>
  <footer>Generated 2026-06-08T13:08:48.058Z</footer>
</body>
</html>
