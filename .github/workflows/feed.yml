name: Regenerate build feed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate feed.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun projects/status-site/generate-feed.ts

      - name: Commit feed.html if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/status-site/feed.html
          if git diff --cached --quiet; then
            echo "No changes to feed.html — skipping commit"
          else
            git commit -m "chore: regenerate build feed [skip ci]"
            git push
          fi
